[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tars-robot"
version = "0.5.3"
description = "TARS robot control library with daemon, dashboard, and SDK"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "CC-BY-NC-4.0"}
authors = [
    {name = "TARS Team"}
]
keywords = ["robotics", "grpc", "tars", "raspberry-pi", "robot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]

# SDK only - lightweight, universal (for app developers)
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
# Daemon + Dashboard (for Raspberry Pi)
daemon = [
    "grpcio-tools>=1.60.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "aiortc>=1.6.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pygame>=2.5.0",
    "pyserial>=3.5",
    "adafruit-circuitpython-pca9685>=3.4.0",
    "adafruit-circuitpython-ina260>=1.3.0",
    "psutil>=5.9.0",
    "aiofiles>=23.0.0",
]

# Install everything (daemon + SDK)
all = [
    "grpcio-tools>=1.60.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "aiortc>=1.6.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pygame>=2.5.0",
    "pyserial>=3.5",
    "adafruit-circuitpython-pca9685>=3.4.0",
    "adafruit-circuitpython-ina260>=1.3.0",
    "psutil>=5.9.0",
    "aiofiles>=23.0.0",
]

[project.urls]
Homepage = "https://github.com/latishab/tars"
Repository = "https://github.com/latishab/tars"
Documentation = "https://github.com/latishab/tars#readme"
Issues = "https://github.com/latishab/tars/issues"

[tool.setuptools.packages.find]
include = ["tars_sdk", "tars_sdk.*"]

[tool.setuptools.package-data]
tars_sdk = ["proto/*.proto", "proto/*.pyi", "py.typed"]
