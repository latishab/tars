[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tars-robot"
version = "0.2.0"
description = "SDK for the TARS robot replica from Interstellar. Control movements, camera, display, and audio streaming via gRPC."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "CC-BY-NC-4.0"}
authors = [
    {name = "Latisha Besariani Hendra"}
]
maintainers = [
    {name = "Latisha Besariani Hendra"}
]
keywords = ["robotics", "grpc", "tars", "interstellar", "raspberry-pi", "robot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
    "loguru>=0.7.0",
]

[project.urls]
Homepage = "https://github.com/latishab/tars"
Repository = "https://github.com/latishab/tars"
Issues = "https://github.com/latishab/tars/issues"

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.60.0",
]

[tool.setuptools.packages.find]
include = ["tars_sdk", "tars_sdk.*"]

[tool.setuptools.package-data]
tars_sdk = ["proto/*.proto", "proto/*.pyi", "py.typed"]
