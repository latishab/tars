// tars.proto

syntax = "proto3";

package tars;

service TarsService {
  // Health & Status
  rpc Health(Empty) returns (HealthResponse);
  rpc GetStatus(Empty) returns (StatusResponse);

  // Version & Updates
  rpc GetVersion(Empty) returns (VersionResponse);
  rpc CheckUpdate(Empty) returns (UpdateCheckResponse);

  // Movement Control
  rpc Move(MoveRequest) returns (MoveResponse);
  rpc Reset(Empty) returns (Empty);

  // Display Control
  rpc SetEmotion(EmotionRequest) returns (Empty);
  rpc SetEyeState(EyeStateRequest) returns (Empty);
  rpc LaunchApp(AppRequest) returns (AppResponse);
  rpc ListApps(Empty) returns (AppListResponse);
  rpc ActivateScreensaver(ScreensaverActivateRequest) returns (Empty);
  rpc DeactivateScreensaver(Empty) returns (Empty);
  rpc ListScreensavers(Empty) returns (ScreensaverListResponse);

  // Camera
  rpc CaptureCamera(CaptureRequest) returns (CaptureResponse);

  // Server streaming (RPi → Client)
  rpc StreamBattery(Empty) returns (stream BatteryStatus);
  rpc StreamMovementStatus(Empty) returns (stream MovementStatus);

  // Bidirectional streaming (for future use)
  rpc StreamAudioLevels(stream AudioLevelRequest) returns (stream AudioLevelResponse);

  // Mic mute control
  rpc SetMicMute(MicMuteRequest) returns (Empty);
  rpc GetMicMute(Empty) returns (MicMuteResponse);
}

// Messages
message Empty {}

message HealthResponse {
  string status = 1;
  string version = 2;
  bool grpc_available = 3;
  bool webrtc_available = 4;
  bool webrtc_connected = 5;
  HardwareStatus hardware = 6;
  BatteryStatus battery = 7;
}

message HardwareStatus {
  bool servos = 1;
  bool camera = 2;
  bool audio = 3;
  bool display = 4;
  bool battery = 5;
  bool moving = 6;
}

message VersionResponse {
  string version = 1;
  string git_commit = 2;
  string build_date = 3;
  string python_version = 4;
  string platform = 5;
  string minimum_client = 6;
}

message UpdateCheckResponse {
  bool update_available = 1;
  string current_version = 2;
  string latest_version = 3;
  string severity = 4;
  string release_notes = 5;
  string pypi_url = 6;
  string github_url = 7;
}

message MoveRequest {
  string movement = 1;
  float speed = 2;
}

message MoveResponse {
  bool success = 1;
  float duration = 2;
  string error = 3;
}

message EmotionRequest {
  string emotion = 1;
}

message EyeStateRequest {
  string state = 1;
}

message CaptureRequest {
  int32 width = 1;
  int32 height = 2;
  int32 quality = 3;
}

message CaptureResponse {
  bytes image = 1;
  int32 width = 2;
  int32 height = 3;
  string format = 4;
}

message StatusResponse {
  bool connected = 1;
  BatteryStatus battery = 2;
  string current_emotion = 3;
  string current_eye_state = 4;
  bool is_moving = 5;
  string current_movement = 6;
}

message BatteryStatus {
  int32 level = 1;
  bool charging = 2;
  float voltage = 3;
  float current = 4;
}

message MovementStatus {
  bool moving = 1;
  string movement = 2;
  float progress = 3;
}

message AudioLevelRequest {
  float level = 1;
}

message AudioLevelResponse {
  bool received = 1;
}

message MicMuteRequest {
  bool muted = 1;
}

message MicMuteResponse {
  bool muted = 1;
}

// Display app and screensaver messages
message AppRequest {
  string name = 1;
}

message AppResponse {
  bool success = 1;
  string error = 2;
}

message AppInfo {
  string name = 1;
  string label = 2;
}

message AppListResponse {
  repeated AppInfo apps = 1;
}

message ScreensaverActivateRequest {
  string name = 1;
}

message ScreensaverListResponse {
  repeated string names = 1;
}
